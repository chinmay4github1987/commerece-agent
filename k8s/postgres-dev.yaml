# Dev/test-cluster Postgres only (kind, minikube, a sandbox EKS namespace).
# For real EKS use Amazon RDS for PostgreSQL and point CHECKPOINT_URL at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: agent}
            - {name: POSTGRES_PASSWORD, value: agent}
            - {name: POSTGRES_DB, value: agentdb}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "agent", "-d", "agentdb"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]

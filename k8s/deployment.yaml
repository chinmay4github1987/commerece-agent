apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-agent-config
data:
  LLM_PROVIDER: "rules"            # switch to "openai" once the secret has OPENAI_API_KEY
  OPENAI_MODEL: "gpt-4o-mini"
  AGENT_MAX_ITERATIONS: "6"
  TOOL_TIMEOUT_S: "2.0"
  TOOL_MAX_RETRIES: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-agent
  labels: {app: commerce-agent}
spec:
  replicas: 2
  revisionHistoryLimit: 5            # enables `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollout
  selector:
    matchLabels: {app: commerce-agent}
  template:
    metadata:
      labels: {app: commerce-agent}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: REPLACE_WITH_ECR_URI/commerce-agent:0.1.0   # e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: commerce-agent-config}
            - secretRef: {name: commerce-agent-secrets}   # API_KEY, OPENAI_API_KEY, CHECKPOINT_URL
          env:
            - name: APP_VERSION
              value: "0.1.0"
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:            # gate traffic on the checkpoint store being reachable
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:             # restart only if the process is wedged
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /app/data}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: data, emptyDir: {}}     # only used if CHECKPOINT_URL is unset (single replica dev)
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-agent
spec:
  selector: {app: commerce-agent}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: commerce-agent
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: commerce-agent}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: commerce-agent
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: commerce-agent}
